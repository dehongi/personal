<ul class="list-unstyled">
  {% for post in latest_posts %}
    <li class="mb-2">
      <a href="{{ post.get_absolute_url }}" class="text-decoration-none">{{ post.title }}</a>
      <small class="text-muted d-block">{{ post.publish|date:'M d, Y' }}</small>
    </li>
  {% empty %}
    <li>No posts yet.</li>
  {% endfor %}
</ul>

{% extends 'pages/base.html' %}

{% load blog_tags %}

{% block title %}
  {{ post.title }}
{% endblock %}

{% block content %}
  <div class="container">
    <h1 class="text-center mt-5">{{ post.title }}</h1>
    <hr class="mt-3 mb-5" />
    <img src="{{ post.image.url }}" alt="{{ post.title }}" class="img-fluid" />
    <div class="text-justify">{{ post.body|linebreaks }}</div>
  </div>
{% endblock %}

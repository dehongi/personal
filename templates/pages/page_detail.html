{% extends 'pages/base.html' %}
{% load bootstrap5 %}

{% block title %}
  {{ page.title }}
{% endblock %}

{% block content %}
  <div class="container col-xxl-8 px-4 py-5">
    <div class="row flex-lg-row-reverse align-items-center g-5 py-5">
      <div class="col-10 col-sm-8 col-lg-6">
        <img src="{{ page.image.url }}" class="d-block mx-lg-auto img-fluid" alt="{{ page.title }}" width="700" height="500" loading="lazy" />
      </div>
      <div class="col-lg-6">
        <h1 class="display-5 fw-bold lh-1 mb-3">{{ page.title }}</h1>
        <p class="lead">{{ page.intro }}</p>
        
      </div>
    </div>

    <div class="row g-5">
      <div class="col-md-8">
        <h3 class="pb-4 mb-4 fst-italic border-bottom">{{ page.title }}</h3>
        <div class="blog-post">{{ page.body|linebreaks }}</div>
      </div>
    </div>
  </div>
{% endblock %}
